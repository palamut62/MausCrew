# MausCrew's Cordis composition for the DeepSeek Harness runtime
# (spec §37–§43, §61, §82).
#
# DSH_CORDIS_CONFIG names the WHOLE plugin tree — there is no merge with a
# built-in default and no working-directory fallback, so this file has to
# carry everything the bundled runtime config carries plus what MausCrew
# adds. It is a copy of that bundled config (python/sdk-runtime `cordis.yml`)
# with one row appended, kept deliberately close to the original so a diff
# against a future SDK release is readable.
#
# The added row is the approval gate. It is the reason this file exists: the
# runtime's own default composition has no approval answerer at all, and
# without one every tool the model calls runs unattended (spec §36, §95).
#
# Pointing a bot at this file is what turns approvals on. `cordis.configPath`
# in the driver config is that switch; the driver refuses to widen the sandbox
# without it.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Agent spine; the SDK server creates agents per sessionId.
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536
    # The rc6 carrier does not bundle dsh-bash-sandbox. Never expose its
    # unconfined bash-local provider in a confined mode; filesystem editing
    # remains available through fs-sandbox below. Full access is explicit and
    # its bash calls still pass through MausCrew approval.
    toolBash: !!js "process.env.DSH_SANDBOX_MODE === 'danger-full-access' ? {} : false"
    toolJobs: !!js "process.env.DSH_SANDBOX_MODE === 'danger-full-access' ? {} : false"

# Stock DeepSeek adapters. The adapter resolves DEEPSEEK_API_KEY and
# DEEPSEEK_BASE_URL from the environment the driver builds, so this file names
# no secret and no route (spec §11, §96).
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# JSONL persistence. DSH_SESSION_ROOT is set by the driver and is also where
# the approval mailbox lives; the fallback exists only for a manual run.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Service seam used by the model-facing question tool and MausCrew's
# mailbox-backed provider below. The custom gate injects this service, so it
# must exist before that plugin can activate.
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# One policy home is shared by bash and filesystem tools. The provider fails
# closed when bwrap/Landlock/Seatbelt cannot enforce the requested mode; it
# never falls through to an unrestricted child. `danger-full-access` remains
# an explicit user choice and still passes mutating calls through MausCrew's
# approval gate below.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_SANDBOX_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# fs-sandbox is the policy-enforcing filesystem backend; the editor is the
# model-facing tool that uses it. Keeping these as separate rows is important:
# mounting only fs-sandbox lets the runtime read workspace instructions but
# gives the model no safe way to perform a requested file edit.
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

# ── MausCrew ─────────────────────────────────────────────────────────────

# The approval gate. Relative names resolve beside this file, so the plugin
# ships with MausCrew and needs no install step.
#
# Everything is read from the environment rather than inlined: the mailbox
# directory is per provider instance, and a path baked in here would make one
# bot's approvals answerable from another's. An unset DSH_MAUSCREW_APPROVAL_DIR
# is not "no approvals" — the plugin denies every dangerous tool in that case.
- id: mauscrew-approval
  name: './mauscrew-approval.mjs'
